<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#232830" />
    <title>Offline | GetPointr</title>
    <style>
      html, body { margin: 0; height: 100%; background: #181c22; color: #f6f5f0;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
        justify-content: center; text-align: center; padding: 32px; box-sizing: border-box; }
      .mark { width: 68px; height: 68px; border-radius: 18px; background: #232830; border: 1.5px solid rgba(246,245,240,0.16);
        display: grid; place-items: center; }
      h1 { font-size: 22px; margin: 20px 0 8px; }
      p { color: #a6b1c0; max-width: 320px; line-height: 1.5; margin: 0 0 24px; }
      button { height: 48px; padding: 0 24px; border: 0; border-radius: 12px; background: #5584b0;
        color: #f6f5f0; font-size: 15px; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">
        <svg width="46" height="46" viewBox="0 0 40 40" fill="none">
          <path d="M 23.8 30.8 A 11.5 11.5 0 1 1 30.8 23.6" stroke="#78A3C8" stroke-width="3.6" stroke-linecap="round" />
          <circle cx="19.5" cy="19.5" r="4.2" fill="#F6F5F0" />
          <path d="M 23.4 23.4 L 31.8 26.5 L 28.4 28.0 L 31.3 30.9 L 29.5 32.7 L 26.6 29.8 L 25.1 33.2 Z" fill="#F6F5F0" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>GetPointr needs an internet connection to link you with your trusted helper. Check your Wi-Fi or cellular data.</p>
      <button onclick="location.replace('/')">Try again</button>
    </main>
  </body>
</html>
