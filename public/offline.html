<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1120" />
    <title>Offline · GetPointr</title>
    <style>
      html, body { margin: 0; height: 100%; background: #060a14; color: #f8fafc;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
        justify-content: center; text-align: center; padding: 32px; box-sizing: border-box; }
      .mark { width: 64px; height: 64px; border-radius: 18px; background: #ff6b1a; display: grid; place-items: center; }
      .dot { width: 20px; height: 20px; border-radius: 50%; background: #fff; }
      h1 { font-size: 22px; margin: 20px 0 8px; }
      p { color: #94a3b8; max-width: 320px; line-height: 1.5; margin: 0 0 24px; }
      button { height: 48px; padding: 0 24px; border: 0; border-radius: 12px; background: #ff6b1a;
        color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark"><div class="dot"></div></div>
      <h1>You're offline</h1>
      <p>GetPointr needs an internet connection to link you with your trusted helper. Check your Wi-Fi or cellular data.</p>
      <button onclick="location.replace('/')">Try again</button>
    </main>
  </body>
</html>
